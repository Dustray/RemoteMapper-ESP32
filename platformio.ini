; PlatformIO Project Configuration File for RemoteMapper-ESP32
; Model: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB Octal PSRAM)

[platformio]
default_envs = esp32s3_n16r8
src_dir = src
include_dir = include

[env:esp32s3_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 16MB Flash & 8MB Octal PSRAM Settings
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Build flags: Enable TinyUSB OTG, NimBLE, Audio/HID composite descriptors
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DCFG_TUSB_MCU=OPT_MCU_ESP32S3
    -DCFG_TUD_ENABLED=1
    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_HID=2
    -DCFG_TUD_CDC=1
    -I include

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.4

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed = 921600

; Native test environment for running unit tests directly on PC
[env:native_test]
platform = native
test_framework = custom
build_flags =
    -std=c++17
    -I include
    -I src
    -DUNIT_TEST_NATIVE
